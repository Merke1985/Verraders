<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>De Verraders — Slachtoffer kiezen</title>
<style>
  :root{
    --bg: #0b0d14;
    --bg2: #12151f;
    --panel: #1a1e2c;
    --panel2: #232939;
    --border: #2f3549;
    --red: #c1272d;
    --red-dim: #6e1b1f;
    --red-glow: rgba(193,39,45,0.45);
    --gold: #d4af37;
    --gold-glow: rgba(212,175,55,0.4);
    --text: #f2ecdf;
    --text-dim: #9aa0b4;
    --safe: #3f9d5e;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', 'Palatino', serif;
    overflow-x: hidden;
  }
  .screen{
    min-height: 100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding: 24px 20px 40px;
  }
  h1{
    font-size: clamp(22px, 3.2vw, 34px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    text-align:center;
    margin: 8px 0 4px;
    text-shadow: 0 0 18px rgba(212,175,55,0.35);
  }
  .subtitle{
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 18px;
    text-align:center;
  }
  .instruction{
    font-size: clamp(18px, 2.6vw, 26px);
    text-align:center;
    margin: 6px 0 22px;
    color: var(--text);
    min-height: 34px;
  }
  .instruction b{ color: var(--gold); }
  .step-dots{ display:flex; gap:10px; margin-bottom: 6px; }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--border);
    transition: all .3s ease;
  }
  .dot.active{ background: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  .dot.done{ background: var(--gold); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 1100px;
    margin-top: 10px;
  }
  .grid.compact{
    display:flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  .grid.vote-grid{
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .tile{
    position: relative;
    background: linear-gradient(160deg, var(--panel), var(--panel2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 10px;
    text-align:center;
    font-size: clamp(15px, 2vw, 19px);
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    min-height: 64px;
    flex: 0 1 160px;
    display:flex; align-items:center; justify-content:center;
    word-break: break-word;
    gap: 6px;
  }
  .tile:active{ transform: scale(0.95); }
  .tile.selected{
    border-color: var(--red);
    background: linear-gradient(160deg, #2b1418, #3a191d);
    box-shadow: 0 0 18px var(--red-glow);
    color: #ffdede;
  }
  .tile.selected-safe{
    border-color: var(--safe);
    background: linear-gradient(160deg, #16281c, #1c3524);
    box-shadow: 0 0 18px rgba(63,157,94,0.5);
    color: #d7ffe4;
  }
  .tile.dimmed{ opacity: 0.28; pointer-events:none; filter: grayscale(0.6); }
  .tile.dead{ opacity: 0.18; pointer-events:none; }
  .tile.candidate{
    border-color: var(--gold);
    background: linear-gradient(160deg, #2a2413, #3a3018);
  }
  .tile.shielded{
    border-color: var(--gold);
    background: linear-gradient(160deg, #21281a, #2b3420);
    box-shadow: 0 0 14px var(--gold-glow);
    color: #f0e6b8;
  }
  .tile.excluded{
    opacity: 0.35;
    pointer-events:none;
  }
  .tile.safe-picked{
    border-color: var(--safe);
    background: linear-gradient(160deg, #123320, #16452b);
    box-shadow: 0 0 18px rgba(63,157,94,0.5);
    color: #c9f5d6;
  }
  .tile.not-safe{
    border-color: var(--red);
    background: linear-gradient(160deg, #2b1418, #3a191d);
    box-shadow: 0 0 14px var(--red-glow);
    color: #ffb3b3;
  }
  .tile.victim-pick{
    box-shadow: 0 0 22px var(--red-glow), 0 0 40px rgba(255,60,60,0.35);
  }
  .tile.round3-tile{
    border-width: 4px;
  }
  .tile.tile-stack{
    flex-direction: column;
    gap: 8px;
  }
  .tile.tile-stack .tile-name-text{
    flex: none;
    text-align: center;
  }
  .tile-status-label{
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 3px 12px;
    border-radius: 999px;
  }
  .tile-status-label.safe-label{
    color: #c9f5d6;
    background: rgba(63,157,94,0.25);
  }
  .tile-status-label.victim-label{
    color: #ffb3b3;
    background: rgba(255,60,60,0.25);
  }
  .tile-status-label.label-placeholder{
    visibility: hidden;
  }
  .tile.roster-dead{
    opacity: 0.5;
    border-color: var(--border);
    background: linear-gradient(160deg, #15171f, #1a1e2c);
    color: var(--text-dim);
  }
  .dead-name{
    text-decoration: none;
  }
  .dead-status-label{
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .add-row{
    display:flex;
    gap: 10px;
    align-items:center;
    margin-top: 26px;
  }
  input.text-input{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 16px;
    font-family: inherit;
    width: 220px;
  }
  .plus-btn{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--gold);
    color: #2a2413;
    border: none;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
    line-height: 1;
  }

  .bar{
    display:flex; gap:12px; margin-top: 26px; flex-wrap:wrap; justify-content:center;
  }
  button.action{
    font-family: inherit;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 15px;
    cursor:pointer;
    letter-spacing: 0.5px;
  }
  button.action:hover{ border-color: var(--gold); }
  button.action.primary{
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  button.action.confirmed{
    border-color: var(--safe);
    background: rgba(63,157,94,0.15);
    color: var(--safe);
  }
  .endgame-banner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
    background: linear-gradient(160deg, #2b1418, #3a191d);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 10px 18px;
    margin: 10px 0 4px;
    color: #ffdede;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .endgame-vote-grid{
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .endgame-vote-tile{
    background: linear-gradient(160deg, var(--panel), var(--panel2));
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition: border-color .15s ease, background .15s ease;
  }
  .endgame-vote-tile.voted-groen{ border-color: var(--safe); background: rgba(63,157,94,0.14); }
  .endgame-vote-tile.voted-rood{ border-color: var(--red); background: rgba(196,58,58,0.14); }
  .endgame-vote-chips{ display:flex; gap:8px; }
  button.action.gold{
    background: var(--gold);
    border-color: var(--gold);
    color: #2a2413;
    font-weight: bold;
  }
  button.action.safe{
    background: var(--safe);
    border-color: var(--safe);
    color: white;
  }
  button.action.primary:disabled{
    background: var(--border);
    border-color: var(--border);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  button.action.ghost{ background: transparent; }
  button.action.lg{
    font-size: 19px;
    padding: 18px 34px;
    border-radius: 14px;
  }
  button.action.sm{
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 8px;
    opacity: 0.7;
  }

  textarea{
    width: 100%; max-width: 520px; height: 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    resize: vertical;
  }
  .hint{ color: var(--text-dim); font-size: 13px; margin-top: 8px; max-width: 480px; text-align:center; }

  .reveal-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: 60vh; width:100%;
  }
  .reveal-label{ color: var(--text-dim); letter-spacing: 3px; font-size: 15px; text-transform: uppercase; margin-bottom: 10px;}
  .reveal-name{
    font-size: clamp(38px, 8vw, 84px);
    color: var(--red);
    text-shadow: 0 0 30px var(--red-glow);
    text-align:center;
    animation: pulse-in .5s ease;
    margin: 6px 0 4px;
  }
  .reveal-name.safe-color{
    color: var(--safe);
    text-shadow: 0 0 30px rgba(63,157,94,0.5);
  }
  .reveal-sub{ color: var(--text-dim); font-size: 16px; margin-bottom: 6px; }
  .reveal-message{
    color: var(--text);
    font-size: clamp(24px, 5.5vw, 46px);
    font-weight: bold;
    line-height: 1.35;
    text-align: center;
    max-width: 680px;
    margin: 16px 0 28px;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .reveal-votes{ color: var(--text-dim); font-size: 14px; letter-spacing: 1px; margin-bottom: 30px; }
  @keyframes pulse-in{
    0%{ transform: scale(0.7); opacity:0; }
    60%{ transform: scale(1.08); opacity:1; }
    100%{ transform: scale(1); }
  }

  .footer-log{
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 13px;
    text-align:center;
    max-width: 600px;
    line-height: 1.8;
  }
  .footer-log .victim-chip{
    display:inline-block;
    background: var(--panel2);
    border: 1px solid var(--red-dim);
    border-radius: 20px;
    padding: 4px 12px;
    margin: 3px;
    color: #e6b8ba;
  }
  .footer-log .none-chip{
    display:inline-block;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    margin: 3px;
    color: var(--text-dim);
  }
  .footer-log .ban-chip{
    display:inline-block;
    background: var(--panel2);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 4px 12px;
    margin: 3px;
    color: var(--gold);
  }
  .mode-toggle{
    display:flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 5px;
    margin-bottom: 20px;
  }
  .mode-btn{
    font-family: inherit;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .mode-btn.active-shield{
    background: var(--safe);
    color: white;
  }
  .mode-btn.active-ban{
    background: var(--gold);
    color: #2a2413;
  }
  .mode-btn.active-night{
    background: var(--red);
    color: white;
    box-shadow: 0 0 12px var(--red-glow);
  }
  .night-btn{
    background: var(--red);
    color: white;
    box-shadow: 0 0 12px var(--red-glow);
  }
  .corner-btn{
    position: fixed;
    top: 18px;
    right: 18px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.5px;
    z-index: 20;
  }
  .corner-btn:hover{ border-color: var(--red); color: var(--text); }
  #room-indicator{
    position: fixed;
    bottom: 12px;
    left: 14px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    z-index: 20;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  #room-indicator .leave-link{
    text-decoration: underline;
    cursor: pointer;
  }
  .dot-status{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot-status.online{ background: var(--safe); box-shadow: 0 0 6px rgba(63,157,94,0.6); }
  .dot-status.offline{ background: var(--red); box-shadow: 0 0 6px var(--red-glow); }
  .dot-status.connecting{ background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
  .room-code-big{
    font-size: 44px;
    letter-spacing: 8px;
    color: var(--gold);
    text-align:center;
    margin: 10px 0 6px;
    font-weight:bold;
  }
  .connect-divider{
    color: var(--text-dim);
    font-size: 13px;
    margin: 28px 0;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .tile.traitor-marked{
    border-color: var(--red);
    background: linear-gradient(160deg, #2b1418, #3a191d);
    box-shadow: 0 0 14px var(--red-glow);
    color: #ffb3b3;
  }
  .tile.tile-stack{
    flex-direction: column;
    gap: 6px;
  }
  .tile.voted{
    border-color: var(--red);
    background: linear-gradient(160deg, #2b1418, #3a191d);
    box-shadow: 0 0 14px var(--red-glow);
  }
  .tile-icon{
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 0.8em;
  }
  .tile-icon.icon-hidden{
    visibility: hidden;
  }
  .tile-name-row{
    display:flex;
    align-items:center;
    gap: 10px;
    width: 100%;
  }
  .tile-name-text{
    flex: 1 1 auto;
    min-width: 0;
    text-align: left;
    word-break: normal;
    overflow-wrap: anywhere;
  }
  .vote-row{
    display:flex;
    align-items:center;
    gap: 18px;
    flex-shrink: 0;
  }
  .tile-name-row .vote-row{
    gap: 8px;
  }
  .vote-row.vote-row-empty{
    visibility: hidden;
  }
  .vote-badge{
    background: var(--red);
    color: white;
    border-radius: 14px;
    padding: 3px 13px;
    font-size: 16px;
    font-weight: bold;
    min-width: 14px;
    text-align:center;
  }
  .vote-minus{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
  }
  .small-link{
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 30px;
    text-decoration: underline;
    cursor: pointer;
  }
  .badge-count{
    color: var(--text-dim);
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 20px;
  }
  .warn{
    background: var(--panel2);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    max-width: 480px;
    text-align:center;
    margin-bottom: 16px;
  }
  .night-tag{
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="room-indicator"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var DEFAULT_NAMES = [
    'Annelies', 'Arjen', 'Daan', 'Edwin', 'Elsbeth K.',
    'Elsbeth S.', 'Geertje', 'Hanne', 'Johan', 'Joost',
    'Joren', 'Jurjen', 'Koen', 'Lize', 'Nick',
    'Niels', 'Nieske', 'Sander', 'Siem'
  ];

  // ---------- SYNC (2 iPads, live, via Supabase) ----------
  var SUPABASE_URL = 'https://gtdzuuvlluyofkvbpusx.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0ZHp1dXZsbHV5b2ZrdmJwdXN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNTUwMjAsImV4cCI6MjA2NzYzMTAyMH0.DcHwCLuyyVJvs0Ugpr7bE0Az5_tkES4kE_P0SUFOyus';
  var ROOM_TABLE = 'verraders_game_state';
  var ROOM_KEY = 'verraders-room-code';
  var ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no O/0/I/1 — easy to read aloud

  var supabaseClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      })
    : null;

  var roomCode = null;
  var realtimeChannel = null;
  var syncStatus = 'offline'; // offline | connecting | online
  var lastAppliedUpdatedAt = null; // guards against re-applying our own echo
  var pollTimer = null;

  function makeRoomCode(){
    var code = '';
    for(var i=0;i<5;i++){ code += ROOM_ALPHABET[Math.floor(Math.random()*ROOM_ALPHABET.length)]; }
    return code;
  }

  function loadRoomCode(){
    try{ return localStorage.getItem(ROOM_KEY); } catch(e){ return null; }
  }
  function saveRoomCode(code){
    try{ localStorage.setItem(ROOM_KEY, code); } catch(e){}
  }
  function clearRoomCode(){
    try{ localStorage.removeItem(ROOM_KEY); } catch(e){}
  }

  var lastSyncError = '';

  function setSyncStatus(s, errMsg){
    syncStatus = s;
    if(errMsg) lastSyncError = errMsg;
    if(s === 'online') lastSyncError = '';
    updateRoomIndicator();
  }

  function updateRoomIndicator(){
    var box = document.getElementById('room-indicator');
    if(!box) return;
    box.innerHTML = '';
    if(!roomCode){ return; }
    var dotClass = syncStatus === 'online' ? 'online' : (syncStatus === 'connecting' ? 'connecting' : 'offline');
    var label = syncStatus === 'online' ? 'verbonden (live)' : (syncStatus === 'connecting' ? 'synchroniseert…' : 'offline (lokaal)');
    if(syncStatus === 'offline' && lastSyncError){ label += ' — ' + lastSyncError; }
    var span = document.createElement('span');
    var dot = document.createElement('span');
    dot.className = 'dot-status ' + dotClass;
    span.appendChild(dot);
    span.appendChild(document.createTextNode('Kamer ' + roomCode + ' — ' + label));
    box.appendChild(span);
    var leave = document.createElement('span');
    leave.className = 'leave-link';
    leave.textContent = 'andere kamer';
    leave.addEventListener('click', function(){
      if(confirm('Deze iPad loskoppelen van kamer ' + roomCode + '? Het spel zelf blijft bestaan.')){
        clearRoomCode();
        location.reload();
      }
    });
    box.appendChild(leave);
  }

  function applyIncoming(row){
    // row: {state, updated_at} — ignore stale/duplicate/our-own-echo payloads.
    if(!row || !row.state) return;
    var incoming = row.state;
    if(typeof incoming === 'string'){
      try{ incoming = JSON.parse(incoming); } catch(e){ return; }
    }
    if(row.updated_at && row.updated_at === lastAppliedUpdatedAt) return; // already have this exact version
    state = incoming;
    if(row.updated_at) lastAppliedUpdatedAt = row.updated_at;
    persistLocalOnly();
    paint();
  }

  function subscribeRealtime(){
    if(!supabaseClient || !roomCode) return;
    if(realtimeChannel){ supabaseClient.removeChannel(realtimeChannel); }
    realtimeChannel = supabaseClient
      .channel('room-' + roomCode)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: ROOM_TABLE, filter: 'room_code=eq.' + roomCode
      }, function(payload){
        applyIncoming(payload.new);
      })
      .subscribe(function(status){
        if(status === 'SUBSCRIBED') setSyncStatus('online');
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
          if(syncStatus === 'online') setSyncStatus('connecting'); // fall back to polling, not a hard "offline"
        }
      });
  }

  // Runs continuously as a safety net in case the realtime websocket never
  // confirms (some networks block/throttle it) — polling still gets both
  // iPads in sync within a few seconds either way.
  function startPolling(){
    if(pollTimer) return;
    pollTimer = setInterval(function(){
      if(roomCode && supabaseClient && document.visibilityState === 'visible'){
        refreshFromRemote();
      }
    }, 3000);
  }

  function refreshFromRemote(){
    if(!supabaseClient || !roomCode) return;
    supabaseClient.from(ROOM_TABLE).select('state, updated_at').eq('room_code', roomCode).maybeSingle()
      .then(function(res){
        if(res.error){ setSyncStatus('offline', res.error.message || String(res.error)); return; }
        applyIncoming(res.data);
        if(syncStatus !== 'online') setSyncStatus('connecting');
      })
      .catch(function(err){ setSyncStatus('offline', (err && err.message) || String(err)); });
  }

  function pushRemote(){
    if(!supabaseClient || !roomCode) return;
    var stamp = new Date().toISOString();
    supabaseClient.from(ROOM_TABLE).upsert({
      room_code: roomCode,
      state: state,
      updated_at: stamp
    }, { onConflict: 'room_code' }).then(function(res){
      if(res.error){ setSyncStatus('offline', res.error.message || String(res.error)); return; }
      lastAppliedUpdatedAt = stamp;
      if(syncStatus === 'offline') setSyncStatus('connecting');
    }).catch(function(err){ setSyncStatus('offline', (err && err.message) || String(err)); });
  }

  function connectToRoom(code, isJoin){
    roomCode = code;
    saveRoomCode(code);
    updateRoomIndicator();
    if(!supabaseClient){
      loadLocalCache();
      paint();
      return;
    }
    setSyncStatus('connecting');
    var proceed = function(){
      subscribeRealtime();
      startPolling();
      persistLocalOnly();
      paint();
      pushRemote();
    };
    if(isJoin){
      supabaseClient.from(ROOM_TABLE).select('state, updated_at').eq('room_code', code).maybeSingle()
        .then(function(res){
          if(res.error){ lastSyncError = res.error.message || String(res.error); }
          if(res.data && res.data.state){
            applyIncoming(res.data);
          } else {
            loadLocalCache();
          }
          proceed();
        })
        .catch(function(err){
          lastSyncError = (err && err.message) || String(err);
          loadLocalCache();
          proceed();
        });
    } else {
      loadLocalCache();
      proceed();
    }
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && roomCode){
      refreshFromRemote();
    }
  });

  var state = {
    phase: 'setup', // setup | shield | traitors | round1 | round2 | round3 | forced | noVictim | reveal
    players: [],    // {name, alive:true}
    night: 0,
    shielded: [],   // names with a shield this night (excluded from pool)
    votes: {},      // name -> vote count, for the verbannen (banish) tally
    traitors: [],   // names marked as traitor — hidden from every night screen
    traitorReturnPhase: null,
    pendingGameStart: false, // true tussen 'Start spel' en het bevestigen van de verraders
    pendingBanWinner: null, // tentatieve verbanning, in afwachting van bevestiging
    pendingBanVotes: null,
    rosterReturnPhase: null,
    genericVictimReturnPhase: null, // waar terug naartoe na het algemene "je bent vermoord"-scherm
    eligiblePool: [], // alive & not shielded & not traitor, for round1
    selected3: [],  // names picked in round1
    remaining2: [], // names remaining after round2 (safe pick removed)
    round2Pick: null, // tentative "safe" tap in round2, awaiting confirm
    round3Pick: null, // tentative "safe" tap in round3, awaiting confirm
    round1TwoPick: false, // true als er precies 2 verraders zijn — dan 2 ipv 3 opties in ronde 1
    recruitPick: null,    // tentative keuze op het "kies een nieuwe verrader" scherm
    silentMurderPick: null, // tentative keuze op het "moorden zonder iPad" scherm
    lastVictimReturnPhase: null, // waar "Vergissing" op het "is vermoord"-scherm naartoe gaat
    newTraitorName: null, // naam van de zojuist gerekruteerde verrader, voor de privé-onthulling
    endgameActive: false, // true zodra 'Eindspel' is gestart — blijft aan tot het spel echt eindigt of handmatig wordt teruggezet
    endgameVotes: {},     // name -> 'rood' | 'groen', voor de rood/groen stemming tijdens het eindspel
    lastVictim: null,
    lastBanished: null,
    lastBanishedVotes: null,
    victimHistory: [], // list of {night, victim, type} — victim null = niemand vermoord
    photoVersion: 0, // bumped whenever iemand een foto uploadt via de statuspagina — voor cache-busting
    voteTotals: {},   // name -> totaal aantal tegenstemmen ooit ontvangen (blijft staan na een stemronde)
    shieldCounts: {}  // name -> totaal aantal keer dat iemand een schild heeft gehad
  };

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'text') e.textContent = attrs[k];
      else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

  function alivePlayers(){
    return state.players.filter(function(p){ return p.alive; });
  }

  function nonTraitorAlive(){
    return alivePlayers().filter(function(p){ return state.traitors.indexOf(p.name) === -1; });
  }

  // state.traitors kan namen van inmiddels vermoorde/verbannen verraders blijven bevatten
  // (die worden nooit automatisch verwijderd) — gebruik dit overal waar het aantal
  // NOG LEVENDE verraders telt, anders klopt de 1- of 2-verraders-logica niet meer
  // nadat een verrader handmatig of via het spel is afgevallen.
  function aliveTraitors(){
    return state.traitors.filter(function(n){
      return state.players.some(function(p){ return p.name === n && p.alive; });
    });
  }

  function openTraitorsPhase(){
    state.traitorReturnPhase = state.phase;
    state.phase = 'traitors';
    render();
  }

  function closeTraitorsPhase(){
    if(state.pendingGameStart){
      state.pendingGameStart = false;
      goToShieldPhase();
      return;
    }
    state.phase = state.traitorReturnPhase || 'shield';
    render();
  }

  function openRosterPhase(){
    state.rosterReturnPhase = state.phase;
    state.phase = 'roster';
    render();
  }

  function cornerRosterBtn(){
    var btn = el('button', {class:'corner-btn', text:'📝 Namenlijst bewerken'});
    btn.addEventListener('click', function(){ openRosterPhase(); });
    return btn;
  }

  // ---------- ALGEMEEN "JE BENT VERMOORD" SCHERM (vangnet) — voor als er per ongeluk te
  // snel doorgeklikt is en het echte victimInstructions-scherm gemist is ----------
  function openGenericVictimScreen(){
    state.genericVictimReturnPhase = state.phase;
    state.phase = 'genericVictimScreen';
    render();
  }

  function closeGenericVictimScreen(){
    state.phase = state.genericVictimReturnPhase || 'shield';
    render();
  }

  function genericVictimLink(){
    var link = el('div', {class:'small-link', text:'💀 Toon "je bent vermoord"-scherm'});
    link.addEventListener('click', function(){ openGenericVictimScreen(); });
    return link;
  }

  function renderGenericVictimScreen(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-name', text:'Je bent vermoord'}));
    wrap.appendChild(el('div', {class:'reveal-message', text:'Verlaat zonder geluid te maken de tafel en loop naar de andere ruimte.'}));

    var bar = el('div', {class:'bar'});
    var back = el('button', {class:'action primary lg', text:'← Terug'});
    back.addEventListener('click', function(){ closeGenericVictimScreen(); });
    bar.appendChild(back);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  function closeRosterPhase(){
    state.phase = state.rosterReturnPhase || 'shield';
    render();
  }

  // paint() only redraws the DOM from the current `state` — used when state
  // arrived from elsewhere (realtime) and should NOT be written back out.
  function paint(){
    var app = document.getElementById('app');
    app.innerHTML = '';
    if(state.phase === 'setup') app.appendChild(renderSetup());
    else if(state.phase === 'shield') app.appendChild(renderShield());
    else if(state.phase === 'nightHandoff') app.appendChild(renderNightHandoff());
    else if(state.phase === 'nightIpadHandoff') app.appendChild(renderNightIpadHandoff());
    else if(state.phase === 'silentMurderIntro') app.appendChild(renderSilentMurderIntro());
    else if(state.phase === 'silentMurderPick') app.appendChild(renderSilentMurderPick());
    else if(state.phase === 'silentMurderConfirm') app.appendChild(renderSilentMurderConfirm());
    else if(state.phase === 'traitors') app.appendChild(renderTraitors());
    else if(state.phase === 'roster') app.appendChild(renderRoster());
    else if(state.phase === 'genericVictimScreen') app.appendChild(renderGenericVictimScreen());
    else if(state.phase === 'round1') app.appendChild(renderRound1());
    else if(state.phase === 'round2') app.appendChild(renderRound2());
    else if(state.phase === 'round3') app.appendChild(renderRound3());
    else if(state.phase === 'forced') app.appendChild(renderForced());
    else if(state.phase === 'noVictim') app.appendChild(renderNoVictim());
    else if(state.phase === 'reveal') app.appendChild(renderReveal());
    else if(state.phase === 'victimInstructions') app.appendChild(renderVictimInstructions());
    else if(state.phase === 'nextDayConfirm') app.appendChild(renderNextDayConfirm());
    else if(state.phase === 'banConfirm') app.appendChild(renderBanConfirm());
    else if(state.phase === 'banReveal') app.appendChild(renderBanReveal());
    else if(state.phase === 'banIdentityConfirm') app.appendChild(renderBanIdentityConfirm());
    else if(state.phase === 'banIdentityReveal') app.appendChild(renderBanIdentityReveal());
    else if(state.phase === 'endGameChoice') app.appendChild(renderEndGameChoice());
    else if(state.phase === 'endGameRedOutcome') app.appendChild(renderEndGameRedOutcome());
    else if(state.phase === 'endGameConfirm') app.appendChild(renderEndGameConfirm());
    else if(state.phase === 'identityReveal') app.appendChild(renderIdentityReveal());
    else if(state.phase === 'winnersConfirm') app.appendChild(renderWinnersConfirm());
    else if(state.phase === 'gameEnd') app.appendChild(renderGameEnd());
    else if(state.phase === 'gameEndExitConfirm') app.appendChild(renderGameEndExitConfirm());
    else if(state.phase === 'recruitTraitorIntro') app.appendChild(renderRecruitTraitorIntro());
    else if(state.phase === 'recruitTraitor') app.appendChild(renderRecruitTraitor());
    else if(state.phase === 'recruitHandoff') app.appendChild(renderRecruitHandoff());
    else if(state.phase === 'recruitReveal') app.appendChild(renderRecruitReveal());
  }

  // render() is for LOCAL actions: repaint + persist (local cache + remote room).
  function render(){
    paint();
    saveState();
  }

  // ---------- AUTOSAVE (survives Safari reloading a backgrounded tab) ----------
  var STORAGE_KEY = 'verraders-game-state-v1';
  var storageAvailable = true;

  function localCacheKey(){
    return STORAGE_KEY + (roomCode ? (':' + roomCode) : '');
  }

  function persistLocalOnly(){
    try{
      localStorage.setItem(localCacheKey(), JSON.stringify(state));
    } catch(e){
      storageAvailable = false;
    }
  }

  function saveState(){
    persistLocalOnly();
    pushRemote();
  }

  function loadLocalCache(){
    try{
      var raw = localStorage.getItem(localCacheKey());
      if(raw){
        var parsed = JSON.parse(raw);
        Object.keys(parsed).forEach(function(k){ state[k] = parsed[k]; });
      }
    } catch(e){
      storageAvailable = false;
    }
  }

  // ---------- SETUP ----------
  function renderSetup(){
    if(state.players.length === 0){
      state.players = DEFAULT_NAMES.map(function(n){ return {name:n, alive:true}; });
    }
    return renderRosterScreen('setup');
  }

  // ---------- SHIELD (begeleider) ----------
  function goToShieldPhase(){
    state.shielded = [];
    state.selected3 = [];
    state.remaining2 = [];
    state.eligiblePool = [];
    state.round2Pick = null;
    state.round3Pick = null;
    state.votes = {};
    if(!state.shieldMode) state.shieldMode = 'schild';
    state.phase = 'shield';
    render();
  }

  // Used when backing out of a night round (round1/forced/noVictim) — terug naar het
  // moord-menu (nightHandoff), niet helemaal terug naar de dag.
  function backToShieldPreserving(){
    state.selected3 = [];
    state.remaining2 = [];
    state.eligiblePool = [];
    state.round2Pick = null;
    state.round3Pick = null;
    state.night -= 1;
    state.phase = 'nightHandoff';
    render();
  }

  // Used when backing out of round1 of een handmatige moord (silentMurderPick) —
  // maar 1 scherm terug, naar "Ga bij een verrader staan" (nightIpadHandoff).
  function backToNightIpadHandoff(){
    state.selected3 = [];
    state.remaining2 = [];
    state.eligiblePool = [];
    state.round2Pick = null;
    state.round3Pick = null;
    state.night -= 1;
    state.phase = 'nightIpadHandoff';
    render();
  }

  // Start (of herstart) de rood/groen stemronde van het eindspel. Zijn er nog maar
  // 2 spelers over, dan heeft stemmen geen zin meer (rood zou toch niemand meer
  // over laten om te verbannen) — dan gaat het direct door naar de bevestiging.
  function enterEndgameChoice(){
    state.endgameVotes = {};
    state.phase = alivePlayers().length <= 2 ? 'endGameConfirm' : 'endGameChoice';
    render();
  }

  // Shared top menu (Opdracht / Vermoorden / Verbannen) — used on both the
  // shield/ban screen and the night-handoff screen, so it's never hidden.
  function buildModeBar(){
    var modeBar = el('div', {class:'mode-toggle'});
    var shieldBtn = el('button', {class:'mode-btn' + (state.phase === 'shield' && state.shieldMode === 'schild' ? ' active-shield' : ''), text:'🛡 Opdracht'});
    shieldBtn.addEventListener('click', function(){ state.shieldMode = 'schild'; state.phase = 'shield'; render(); });
    modeBar.appendChild(shieldBtn);

    var startNightBtn = el('button', {class:'mode-btn' + (state.phase === 'nightHandoff' ? ' active-night' : ''), text:'🗡 Vermoorden'});
    startNightBtn.addEventListener('click', function(){
      state.phase = 'nightHandoff';
      render();
    });
    modeBar.appendChild(startNightBtn);

    var banBtn = el('button', {class:'mode-btn' + (state.phase === 'shield' && state.shieldMode === 'verbannen' ? ' active-ban' : ''), text:'⚔ Verbannen'});
    banBtn.addEventListener('click', function(){ state.shieldMode = 'verbannen'; state.phase = 'shield'; render(); });
    modeBar.appendChild(banBtn);
    return modeBar;
  }

  function renderShield(){
    var screen = el('div', {class:'screen'});
    screen.appendChild(cornerRosterBtn());
    screen.appendChild(el('h1', {text:'Begeleider'}));

    screen.appendChild(buildModeBar());

    if(state.shieldMode === 'verbannen' && state.endgameActive){
      var endgameBanner = el('div', {class:'endgame-banner'});
      endgameBanner.appendChild(el('span', {text:'⚡ Eindspel actief'}));
      screen.appendChild(endgameBanner);
    }

    var instr = el('div', {class:'instruction'});
    if(state.shieldMode === 'schild'){
      instr.textContent = 'De opdracht wordt gespeeld. Geef hieronder aan wie een schild hebben verdiend.';
    } else {
      instr.innerHTML = 'Tik op een naam om er een <b>stem</b> aan te geven';
    }
    screen.appendChild(instr);
    var alive = alivePlayers();
    if(state.shieldMode === 'schild'){
      screen.appendChild(el('div', {class:'badge-count', text: state.shielded.length + ' met schild · ' + (alive.length - state.shielded.length) + ' zonder schild van ' + alive.length + ' levend'}));
    } else {
      var totalVotes = Object.keys(state.votes).reduce(function(sum, n){ return sum + state.votes[n]; }, 0);
      screen.appendChild(el('div', {class:'badge-count', text: totalVotes + ' stem' + (totalVotes === 1 ? '' : 'men') + ' uitgebracht van ' + alive.length + ' levend'}));
    }

    var grid = el('div', {class:'grid' + (state.shieldMode !== 'schild' ? ' vote-grid' : '')});
    alive.forEach(function(p){
      if(state.shieldMode === 'schild'){
        var isShielded = state.shielded.indexOf(p.name) !== -1;
        var tile = el('div', {class:'tile' + (isShielded ? ' shielded':'')});
        tile.appendChild(el('span', {class:'tile-icon' + (isShielded ? '' : ' icon-hidden'), text:'🛡'}));
        tile.appendChild(document.createTextNode(p.name));
        tile.addEventListener('click', function(){
          var idx = state.shielded.indexOf(p.name);
          if(idx !== -1){
            state.shielded.splice(idx,1);
            state.shieldCounts[p.name] = Math.max(0, (state.shieldCounts[p.name] || 0) - 1);
          } else {
            state.shielded.push(p.name);
            state.shieldCounts[p.name] = (state.shieldCounts[p.name] || 0) + 1;
          }
          render();
        });
        grid.appendChild(tile);
      } else {
        var voteCount = state.votes[p.name] || 0;
        var tile = el('div', {class:'tile' + (voteCount > 0 ? ' voted' : '')});
        var contentRow = el('div', {class:'tile-name-row'});
        contentRow.appendChild(el('span', {class:'tile-name-text', text: p.name}));
        var row = el('div', {class:'vote-row' + (voteCount > 0 ? '' : ' vote-row-empty')});
        row.appendChild(el('span', {class:'vote-badge', text: String(voteCount)}));
        var minus = el('button', {class:'vote-minus', text:'−'});
        minus.addEventListener('click', function(ev){
          ev.stopPropagation();
          var v = (state.votes[p.name] || 0) - 1;
          if(v <= 0) delete state.votes[p.name];
          else state.votes[p.name] = v;
          state.voteTotals[p.name] = Math.max(0, (state.voteTotals[p.name] || 0) - 1);
          render();
        });
        row.appendChild(minus);
        contentRow.appendChild(row);
        tile.appendChild(contentRow);
        tile.addEventListener('click', function(){
          state.votes[p.name] = (state.votes[p.name] || 0) + 1;
          state.voteTotals[p.name] = (state.voteTotals[p.name] || 0) + 1;
          render();
        });
        grid.appendChild(tile);
      }
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    if(state.shieldMode !== 'schild'){
      var banExecBtn = el('button', {class:'action primary', text:'Verban wie de meeste stemmen heeft'});
      banExecBtn.addEventListener('click', function(){
        var names = Object.keys(state.votes).filter(function(n){ return state.votes[n] > 0; });
        if(names.length === 0){ alert('Nog geen stemmen uitgebracht.'); return; }
        var max = Math.max.apply(null, names.map(function(n){ return state.votes[n]; }));
        var top = names.filter(function(n){ return state.votes[n] === max; });
        if(top.length > 1){
          alert('Gelijkspel tussen ' + top.join(' en ') + ' (' + max + ' stemmen elk) — breng nog een stem uit om te beslissen.');
          return;
        }
        state.pendingBanWinner = top[0];
        state.pendingBanVotes = max;
        state.phase = 'banConfirm';
        render();
      });
      bar.appendChild(banExecBtn);
      var resetVotesBtn = el('button', {class:'action ghost', text:'Stemmen resetten'});
      resetVotesBtn.addEventListener('click', function(){
        Object.keys(state.votes).forEach(function(n){
          state.voteTotals[n] = Math.max(0, (state.voteTotals[n] || 0) - state.votes[n]);
        });
        state.votes = {};
        render();
      });
      bar.appendChild(resetVotesBtn);
      if(state.endgameActive){
        var backToNormalBtn = el('button', {class:'action ghost', text:'Terug naar normale spel'});
        backToNormalBtn.addEventListener('click', function(){
          state.endgameActive = false;
          render();
        });
        bar.appendChild(backToNormalBtn);
      } else {
        var endGameBtn = el('button', {class:'action ghost', text:'🏆 Eindspel'});
        endGameBtn.addEventListener('click', function(){
          if(!confirm('Eindspel starten?')) return;
          state.endgameActive = true;
          enterEndgameChoice();
        });
        bar.appendChild(endGameBtn);
      }
    }
    screen.appendChild(bar);
    screen.appendChild(genericVictimLink());

    return screen;
  }

  // ---------- NIGHT HANDOFF (blindfold ritual: pass the iPad before the murder screen shows) ----------
  function renderNightHandoff(){
    var screen = el('div', {class:'screen'});
    screen.appendChild(cornerRosterBtn());
    screen.appendChild(el('h1', {text:'Begeleider'}));

    screen.appendChild(buildModeBar());

    var instr = el('div', {class:'instruction'});
    instr.textContent = 'Druk op de knop en laat de verrader kiezen';
    screen.appendChild(instr);

    screen.appendChild(el('div', {class:'warn', text:'👁️‍🗨️ Laat eerst iedereen de blinddoek om doen, druk daarna pas op de knop.'}));

    var bar = el('div', {class:'bar'});
    var fallBtn = el('button', {class:'action primary lg night-btn', text:'De nacht valt'});
    fallBtn.addEventListener('click', function(){
      // Nog maar 1 verrader over: geen keuze tussen ronde/handmatig — deze nacht wordt
      // sowieso niet gemoord, maar meteen een nieuwe verrader gerekruteerd.
      if(aliveTraitors().length === 1){
        state.night += 1;
        state.phase = 'recruitTraitorIntro';
        render();
        return;
      }
      state.phase = 'nightIpadHandoff';
      render();
    });
    bar.appendChild(fallBtn);
    screen.appendChild(bar);
    screen.appendChild(genericVictimLink());

    return screen;
  }

  // ---------- NIGHT IPAD HANDOFF: tussenscherm — de iPad wordt fysiek doorgegeven
  // voordat de verrader(s) daadwerkelijk gaan kiezen ----------
  function renderNightIpadHandoff(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'Ga bij een verrader staan, druk op bevestig en houd de iPad zo voorzichtig mogelijk voor de verrader.'}));

    var bar = el('div', {class:'bar'});
    var confirmBtn = el('button', {class:'action primary lg', text:'Bevestig'});
    confirmBtn.addEventListener('click', function(){
      state.night += 1;
      // Nog maar 1 verrader over: deze nacht wordt niet gemoord, maar wordt er een
      // nieuwe verrader gerekruteerd zodat er weer 2 verraders zijn.
      if(aliveTraitors().length === 1){
        state.phase = 'recruitTraitorIntro';
        render();
        return;
      }
      var stillEligible = nonTraitorAlive();
      var eligible = stillEligible.filter(function(p){ return state.shielded.indexOf(p.name) === -1; }).map(function(p){return p.name;});
      beginNight(eligible);
    });
    bar.appendChild(confirmBtn);
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){
      state.phase = 'nightHandoff';
      render();
    });
    bar.appendChild(back);
    wrap.appendChild(bar);

    // Met nog maar 1 verrader is er geen "moorden" te kiezen — dan zou dit hier niet
    // moeten kunnen (dat wordt al afgevangen vóór dit scherm, maar voor de zekerheid).
    if(aliveTraitors().length > 1){
      var silentLink = el('div', {class:'small-link', text:'Handmatig vermoorden'});
      silentLink.addEventListener('click', function(){
        state.phase = 'silentMurderIntro';
        render();
      });
      wrap.appendChild(silentLink);
    }
    wrap.appendChild(genericVictimLink());

    screen.appendChild(wrap);
    return screen;
  }

  // ---------- SILENT MURDER: verraders hebben elkaar later in het spel non-verbaal een
  // naam doorgegeven, dus geen ronde met de iPad — de begeleider kiest zelf de naam ----------
  function renderSilentMurderIntro(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'Weet je zeker dat je handmatig wilt vermoorden?'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action primary lg', text:'Bevestig'});
    yes.addEventListener('click', function(){
      state.night += 1;
      state.phase = 'silentMurderPick';
      render();
    });
    bar.appendChild(yes);
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){
      state.phase = 'nightIpadHandoff';
      render();

  // ---------- ROSTER (shared: initial setup adds players; later editing also revives dropouts) ----------
  function renderRoster(){

  }

  function renderRosterScreen(mode){
    var screen = el('div', {class:'screen'});
    var hasDead = state.players.some(function(p){ return !p.alive; });

    if(mode === 'setup'){
      screen.appendChild(el('h1', {text:'De Verraders'}));
      screen.appendChild(el('div', {class:'subtitle', text:'Wie doet er mee?'}));
      if(!storageAvailable){
        screen.appendChild(el('div', {class:'warn', text:'⚠️ Deze browser bewaart geen voortgang automatisch (bijv. privénavigatie). Gebruik geen privé-tabblad en sluit Safari niet halverwege het spel.'}));
      }
    } else {
      screen.appendChild(el('h1', {text:'Namenlijst'}));
    }

    var instr = el('div', {class:'instruction'});
    if(mode === 'setup'){
      instr.textContent = 'Voeg spelers toe met de + en druk op Start spel';
    } else if(hasDead){
      instr.textContent = 'Tik op een afgevallen naam om terug te zetten, of corrigeer met ⚔ / 🗡';
    } else {
      instr.textContent = 'Corrigeer een fout met ⚔ verbannen of 🗡 vermoorden';
    }
    screen.appendChild(instr);

    var grid = el('div', {class:'grid'});
    state.players.forEach(function(p){
      if(p.alive){
        if(mode === 'setup'){
          var tile = el('div', {class:'tile tile-stack'});
          tile.appendChild(el('div', {text: p.name}));
          var row = el('div', {class:'vote-row'});
          var removeBtn = el('button', {class:'vote-minus', text:'×'});
          removeBtn.addEventListener('click', function(ev){
            ev.stopPropagation();
            state.players = state.players.filter(function(pp){ return pp !== p; });
            render();
          });
          row.appendChild(removeBtn);
          tile.appendChild(row);
          grid.appendChild(tile);
        } else {
          var aliveTile = el('div', {class:'tile tile-stack'});
          aliveTile.appendChild(el('div', {text: p.name}));
          var actionRow = el('div', {class:'vote-row'});
          var banBtn = el('button', {class:'vote-minus', text:'⚔'});
          banBtn.title = 'Handmatig verbannen';
          banBtn.addEventListener('click', function(ev){
            ev.stopPropagation();
            if(!confirm(p.name + ' handmatig verbannen? Dit corrigeert een fout — diegene ligt dan uit het spel.')) return;
            p.alive = false;
            p.deathType = 'ban';
            state.victimHistory.push({night: state.night, victim: p.name, type:'ban'});
            render();
          });
          var killBtn = el('button', {class:'vote-minus', text:'🗡'});
          killBtn.title = 'Handmatig vermoorden';
          killBtn.addEventListener('click', function(ev){
            ev.stopPropagation();
            if(!confirm(p.name + ' handmatig vermoorden? Dit corrigeert een fout — diegene ligt dan uit het spel.')) return;
            p.alive = false;
            p.deathType = 'murder';
            state.victimHistory.push({night: state.night, victim: p.name, type:'murder'});
            render();
          });
          actionRow.appendChild(banBtn);
          actionRow.appendChild(killBtn);
          aliveTile.appendChild(actionRow);
          grid.appendChild(aliveTile);
        }
      } else {
        var statusLabel = p.deathType === 'ban' ? 'verbannen' : (p.deathType === 'murder' ? 'vermoord' : 'afgevallen');
        var deadTile = el('div', {class:'tile roster-dead tile-stack'});
        deadTile.appendChild(el('div', {class:'dead-name', text: p.name}));
        deadTile.appendChild(el('div', {class:'dead-status-label', text: statusLabel}));
        deadTile.addEventListener('click', function(){
          p.alive = true;
          p.deathType = null;
          p.identityRevealed = false;
          render();
        });
        grid.appendChild(deadTile);
      }
    });
    screen.appendChild(grid);

    var addRow = el('div', {class:'add-row'});
    var input = el('input', {class:'text-input', type:'text', placeholder:'Nieuwe naam'});
    var plusBtn = el('button', {class:'plus-btn', text:'+'});
    function addPlayer(){
      var name = input.value.trim();
      if(!name) return;
      var exists = state.players.some(function(p){ return p.name.toLowerCase() === name.toLowerCase(); });
      if(exists){ alert(name + ' staat al in de lijst.'); return; }
      state.players.push({name: name, alive: true});
      render();
    }
    plusBtn.addEventListener('click', addPlayer);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') addPlayer(); });
    addRow.appendChild(input);
    addRow.appendChild(plusBtn);
    screen.appendChild(addRow);

    var bar = el('div', {class:'bar'});
    if(mode === 'setup'){
      var startBtn = el('button', {class:'action primary lg', text:'Start spel'});
      startBtn.addEventListener('click', function(){
        if(state.players.length < 1){ alert('Voeg minstens 1 speler toe.'); return; }
        state.victimHistory = [];
        state.traitors = [];
        state.night = 0;
        state.pendingGameStart = true;
        state.traitorReturnPhase = null;
        state.phase = 'traitors';
        render();
      });
      bar.appendChild(startBtn);
    } else {
      var doneBtn = el('button', {class:'action primary', text:'Klaar'});
      doneBtn.addEventListener('click', function(){ closeRosterPhase(); });
      bar.appendChild(doneBtn);
    }
    screen.appendChild(bar);

    if(mode !== 'setup'){
      var traitorLink = el('div', {class:'small-link', text:'🗡 Verraders aanpassen'});
      traitorLink.addEventListener('click', function(){ openTraitorsPhase(); });
      screen.appendChild(traitorLink);
    }

    return screen;
  }

  function renderTraitors(){
    var screen = el('div', {class:'screen'});

    screen.appendChild(instr);

    screen.appendChild(el('div', {class:'badge-count', text: aliveTraitors().length + ' verrader(s) geselecteerd van ' + alive.length + ' levend'}));

    var grid = el('div', {class:'grid'});
    alive.forEach(function(p){
      var isTraitor = state.traitors.indexOf(p.name) !== -1;

      tile.appendChild(document.createTextNode(p.name));
      tile.addEventListener('click', function(){

      });

        alert('Kies minimaal 1 verrader voordat je verder kan.');
        return;
      }
      closeTraitorsPhase();
    });

    screen.appendChild(bar);

  function beginNight(eligibleNames){
    state.eligiblePool = eligibleNames;
    state.selected3 = [];
    state.remaining2 = [];
    state.round2Pick = null;
    state.round3Pick = null;
    // Met precies 2 verraders is er geen ruimte voor 3 aparte rondes — dan kiest de
    // eerste verrader meteen 2 kandidaten, en is ronde 3 de doorslaggevende stem.
    state.round1TwoPick = false;
    if(eligibleNames.length === 0){
      state.phase = 'noVictim';
    } else if(eligibleNames.length === 1){
      state.phase = 'forced';
    } else if(eligibleNames.length === 2){
      state.remaining2 = eligibleNames.slice();
      state.phase = 'round3';
    } else {
      state.round1TwoPick = aliveTraitors().length === 2;
      state.phase = 'round1';
    }
    render();
  }

  function stepDots(activeIndex){
    var wrap = el('div', {class:'step-dots'});
    for(var i=0;i<3;i++){
      var cls = 'dot';
      if(i < activeIndex) cls += ' done';
      if(i === activeIndex) cls += ' active';
      wrap.appendChild(el('div', {class:cls}));
    }
    return wrap;
  }

  // ---------- ROUND 1: pick 3 candidates (of 2, bij precies 2 verraders) ----------
  function renderRound1(){
    var screen = el('div', {class:'screen'});
    var pickCount = state.round1TwoPick ? 2 : 3;
    var instr = el('div', {class:'instruction'});
    instr.textContent = 'Kies ' + pickCount + ' slachtoffers';
    screen.appendChild(instr);

    var grid = el('div', {class:'grid'});
    state.eligiblePool.forEach(function(name){
      var isSel = state.selected3.indexOf(name) !== -1;
      var tile = el('div', {class:'tile' + (isSel ? ' selected':'')});
      tile.appendChild(document.createTextNode(name));
      tile.addEventListener('click', function(){
        var idx = state.selected3.indexOf(name);
        if(idx !== -1){
          state.selected3.splice(idx,1);
        } else {
          if(state.selected3.length >= pickCount) return;
          state.selected3.push(name);
        }
        render();
      });
      grid.appendChild(tile);
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    var confirmBtn = el('button', {class:'action primary lg', text:'Bevestig'});
    confirmBtn.disabled = state.selected3.length !== pickCount;
    confirmBtn.addEventListener('click', function(){
      if(state.selected3.length !== pickCount) return;
      if(state.round1TwoPick){
        state.remaining2 = state.selected3.slice();
        state.phase = 'round3';
      } else {
        state.phase = 'round2';
      }
      render();
    });
    bar.appendChild(confirmBtn);
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){ backToNightIpadHandoff(); });
    bar.appendChild(back);
    screen.appendChild(bar);
    return screen;
  }

  // ---------- ROUND 2: drop 1 (spared) from the 3 ----------
  function renderRound2(){
    var screen = el('div', {class:'screen'});
    var instr = el('div', {class:'instruction'});
    instr.textContent = 'Kies wie veilig blijft';
    screen.appendChild(instr);

    var grid = el('div', {class:'grid compact'});
    state.selected3.forEach(function(name){
      var isPicked = state.round2Pick === name;
      var cls = 'tile' + (isPicked ? ' safe-picked' : ' not-safe');
      var tile = el('div', {class: cls});
      tile.appendChild(document.createTextNode(name));
      tile.addEventListener('click', function(){
        state.round2Pick = name;
        render();
      });
      grid.appendChild(tile);
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    if(state.round2Pick){
      var confirmBtn = el('button', {class:'action primary lg', text:'Bevestig'});
      confirmBtn.addEventListener('click', function(){
        state.remaining2 = state.selected3.filter(function(n){ return n !== state.round2Pick; });
        state.round2Pick = null;
        state.phase = 'round3';
        render();
      });
      bar.appendChild(confirmBtn);
    }
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){ state.round2Pick = null; state.phase = 'round1'; render(); });
    bar.appendChild(back);
    screen.appendChild(bar);
    return screen;
  }

  // ---------- ROUND 3: pick who gets murdered -> the other stays safe ----------
  function renderRound3(){
    var screen = el('div', {class:'screen'});
    var instr = el('div', {class:'instruction'});
    instr.textContent = state.round1TwoPick ? 'Breng de doorslaggevende stem uit — kies wie er vermoord wordt!' : 'Kies wie er vermoord wordt!';
    screen.appendChild(instr);

    var grid = el('div', {class:'grid compact'});
    state.remaining2.forEach(function(name){
      var isVictim = state.round3Pick === name;
      var isSafe = state.round3Pick && !isVictim;
      var cls = 'tile round3-tile tile-stack' + (isVictim ? ' not-safe victim-pick' : (isSafe ? ' safe-picked' : ''));
      var tile = el('div', {class: cls});
      tile.appendChild(el('span', {class:'tile-icon' + (isVictim ? '' : ' icon-hidden'), text:'💀'}));
      tile.appendChild(el('span', {class:'tile-name-text', text: name}));
      if(isVictim){ tile.appendChild(el('span', {class:'tile-status-label victim-label', text:'Moorden'})); }
      else if(isSafe){ tile.appendChild(el('span', {class:'tile-status-label safe-label', text:'Redden'})); }
      else { tile.appendChild(el('span', {class:'tile-status-label label-placeholder', text:'Moorden'})); }
      tile.addEventListener('click', function(){
        state.round3Pick = name;
        render();
      });
      grid.appendChild(tile);
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    if(state.round3Pick){
      var confirmBtn = el('button', {class:'action primary lg', text:'Bevestig'});
      confirmBtn.addEventListener('click', function(){
        var victim = state.round3Pick;
        state.round3Pick = null;
        markVictim(victim, 'round3');
      });
      bar.appendChild(confirmBtn);
    }
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){
      // De keuze (round3Pick) blijft bewust bewaard — bij een ongelukkige terug-tik
      // staat de eerder gemaakte keuze er nog als je weer bij dit scherm terugkomt.
      if(state.round1TwoPick){ state.phase = 'round1'; render(); }
      else if(state.selected3.length){ state.phase = 'round2'; render(); }
      else { backToShieldPreserving(); }
    });
    bar.appendChild(back);
    screen.appendChild(bar);
    return screen;
  }

  function markVictim(name, returnPhase){
    state.players.forEach(function(p){
      if(p.name === name){ p.alive = false; p.deathType = 'murder'; }
    });
    state.victimHistory.push({night: state.night, victim: name, type:'murder'});
    state.lastVictim = name;
    state.lastVictimReturnPhase = returnPhase || 'nightHandoff';
    state.phase = 'reveal';
    render();

  // ---------- BAN CONFIRM: extra vangnet vóór de verbanning echt uitgevoerd wordt ----------
  function renderBanConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text: state.pendingBanWinner + ' wordt verbannen. Weet je het zeker?'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action primary lg', text:'Bevestig'});
    yes.addEventListener('click', function(){
      var winner = state.pendingBanWinner;
      var max = state.pendingBanVotes;
      state.players.forEach(function(p){ if(p.name === winner){ p.alive = false; p.deathType = 'ban'; } });
      var sIdx = state.shielded.indexOf(winner);
      if(sIdx !== -1) state.shielded.splice(sIdx,1);
      state.victimHistory.push({night: state.night, victim: winner, type:'ban'});
      state.lastBanished = winner;
      state.lastBanishedVotes = max;
      state.votes = {};
      state.pendingBanWinner = null;
      state.pendingBanVotes = null;
      state.phase = 'banReveal';
      render();
    });
    bar.appendChild(yes);
    var no = el('button', {class:'action ghost sm', text:'← Nee, terug'});
    no.addEventListener('click', function(){
      state.pendingBanWinner = null;
      state.pendingBanVotes = null;
      state.shieldMode = 'verbannen';
      state.phase = 'shield';
      render();
    });
    bar.appendChild(no);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- BAN REVEAL ----------
  function renderBanReveal(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-label', text:'is verbannen'}));
    wrap.appendChild(el('div', {class:'reveal-name', text: state.lastBanished}));
    var alive = alivePlayers().length;
    wrap.appendChild(el('div', {class:'reveal-sub', text: alive + ' spelers nog in het spel'}));
    if(state.lastBanishedVotes){
      wrap.appendChild(el('div', {class:'reveal-votes', text: state.lastBanishedVotes + ' stem' + (state.lastBanishedVotes === 1 ? '' : 'men')}));
    }

    // De verbannen speler onthult normaliter zelf aan tafel of hij/zij verrader of
    // getrouwe was — pas als dat écht is gebeurd tikt de begeleider deze knop aan, en
    // dan volgt een apart scherm met de rol erop (ook zichtbaar op het statusscherm,
    // dus ook voor de afgevallen spelers). Tijdens het eindspel blijft de identiteit
    // juist geheim tot de allerlaatste onthulling — dat scherm slaan we dan over.
    var bannedPlayer = state.players.filter(function(p){ return p.name === state.lastBanished; })[0];

    var bar = el('div', {class:'bar'});
    var nextBtn = el('button', {class:'action primary lg', text: state.endgameActive ? 'Verder in het eindspel' : 'Heeft zijn of haar identiteit onthuld'});
    nextBtn.addEventListener('click', function(){
      if(state.endgameActive){
        enterEndgameChoice();
        return;
      }
      state.phase = 'banIdentityConfirm';
      render();
    });
    bar.appendChild(nextBtn);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- BAN IDENTITY CONFIRM: extra vangnet vóór de rol getoond wordt ----------
  function renderBanIdentityConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'Weet je het zeker?'}));

    var bannedPlayer = state.players.filter(function(p){ return p.name === state.lastBanished; })[0];
    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action safe lg', text:'Ja, onthullen'});
    yes.addEventListener('click', function(){
      if(bannedPlayer) bannedPlayer.identityRevealed = true;
      state.phase = 'banIdentityReveal';
      render();
    });
    bar.appendChild(yes);
    var no = el('button', {class:'action ghost sm', text:'← Nee, terug'});
    no.addEventListener('click', function(){ state.phase = 'banReveal'; render(); });
    bar.appendChild(no);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- BAN IDENTITY REVEAL: de rol van de zojuist verbannen speler in beeld ----------
  function renderBanIdentityReveal(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    var isTraitor = state.traitors.indexOf(state.lastBanished) !== -1;
    wrap.appendChild(el('div', {class:'reveal-label', text: state.lastBanished}));
    wrap.appendChild(el('div', {class:'reveal-name' + (isTraitor ? '' : ' safe-color'), text: isTraitor ? 'Verrader' : 'Getrouwe'}));
    if(state.lastBanishedVotes){
      wrap.appendChild(el('div', {class:'reveal-votes', text: state.lastBanishedVotes + ' stem' + (state.lastBanishedVotes === 1 ? '' : 'men')}));
    }

    var bar = el('div', {class:'bar'});
    var nextBtn = el('button', {class:'action primary lg', text:'Door naar de volgende dag'});
    nextBtn.addEventListener('click', function(){
      state.shieldMode = 'schild';
      state.phase = 'shield';
      render();
    });
    bar.appendChild(nextBtn);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- END GAME CHOICE: iedere overgebleven speler stemt zelf rood of groen ----------
  function renderEndGameChoice(){
    var screen = el('div', {class:'screen'});
    screen.appendChild(el('h1', {text:'Eindspel'}));
    screen.appendChild(el('div', {class:'instruction', text:'Elke speler stemt rood of groen. Zit er ook maar 1 rode stem bij, wordt er opnieuw iemand verbannen.'}));

    var alive = alivePlayers();
    var votedCount = alive.filter(function(p){ return !!state.endgameVotes[p.name]; }).length;
    screen.appendChild(el('div', {class:'badge-count', text: votedCount + ' van ' + alive.length + ' heeft gestemd'}));

    var grid = el('div', {class:'grid endgame-vote-grid'});
    alive.forEach(function(p){
      var vote = state.endgameVotes[p.name];
      var tile = el('div', {class:'endgame-vote-tile' + (vote ? ' voted-' + vote : '')});
      tile.appendChild(el('span', {class:'tile-name-text', text: p.name}));
      var chips = el('div', {class:'endgame-vote-chips'});
      var greenBtn = el('button', {class:'action sm' + (vote === 'groen' ? ' safe' : ' ghost'), text:'🟢 Groen'});
      greenBtn.addEventListener('click', function(){
        state.endgameVotes[p.name] = (state.endgameVotes[p.name] === 'groen') ? undefined : 'groen';
        if(!state.endgameVotes[p.name]) delete state.endgameVotes[p.name];
        render();
      });
      var redBtn = el('button', {class:'action sm' + (vote === 'rood' ? ' primary' : ' ghost'), text:'🔴 Rood'});
      redBtn.addEventListener('click', function(){
        state.endgameVotes[p.name] = (state.endgameVotes[p.name] === 'rood') ? undefined : 'rood';
        if(!state.endgameVotes[p.name]) delete state.endgameVotes[p.name];
        render();
      });
      chips.appendChild(greenBtn);
      chips.appendChild(redBtn);
      tile.appendChild(chips);
      grid.appendChild(tile);
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    var resolveBtn = el('button', {class:'action primary lg', text:'Uitslag bepalen'});
    resolveBtn.addEventListener('click', function(){
      if(votedCount < alive.length){
        alert('Nog niet iedereen heeft gestemd.');
        return;
      }
      var allGreen = alive.every(function(p){ return state.endgameVotes[p.name] === 'groen'; });
      if(allGreen){
        // endgameVotes blijft nog even bewaard zodat de statuspagina tijdens het
        // bevestigingsscherm de rood/groen-uitslag kan blijven tonen.
        state.phase = 'endGameConfirm';
      } else {
        state.endgameVotes = {};
        state.phase = 'endGameRedOutcome';
      }
      render();
    });
    bar.appendChild(resolveBtn);
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){
      state.shieldMode = 'verbannen';
      state.phase = 'shield';
      render();
    });
    bar.appendChild(back);
    screen.appendChild(bar);

    return screen;
  }

  // ---------- END GAME CONFIRM: laatste bevestiging voordat de identiteiten onthuld worden ----------
  function renderEndGameConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'Het spel beëindigt nu. Weet je dat zeker?'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action safe lg', text:'Ja, beëindigen'});
    yes.addEventListener('click', function(){
      state.endgameVotes = {};
      state.phase = 'identityReveal';
      render();
    });
    bar.appendChild(yes);
    var no = el('button', {class:'action ghost sm', text:'← Nee, terug'});
    no.addEventListener('click', function(){
      enterEndgameChoice();
    });
    bar.appendChild(no);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- END GAME RED OUTCOME: tussenscherm na een rode stem — er moet opnieuw verbannen worden ----------
  function renderEndGameRedOutcome(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    var endgameBanner = el('div', {class:'endgame-banner'});
    endgameBanner.appendChild(el('span', {text:'⚡ Eindspel actief'}));
    wrap.appendChild(endgameBanner);
    wrap.appendChild(el('div', {class:'reveal-message', text:'Er is rood gestemd. Er moet opnieuw iemand verbannen worden.'}));

    var bar = el('div', {class:'bar'});
    var goBtn = el('button', {class:'action primary lg', text:'Door naar verbannen'});
    goBtn.addEventListener('click', function(){
      state.shieldMode = 'verbannen';
      state.phase = 'shield';
      render();
    });
    bar.appendChild(goBtn);
    var backBtn = el('button', {class:'action ghost sm', text:'← Terug naar rood/groen'});
    backBtn.addEventListener('click', function(){
      enterEndgameChoice();
    });
    bar.appendChild(backBtn);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- IDENTITY REVEAL: tussenscherm voor de spelers hun rol hardop delen ----------
  function renderIdentityReveal(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'De spelers onthullen nu hun identiteit!'}));

    var bar = el('div', {class:'bar'});
    var revealBtn = el('button', {class:'action primary lg', text:'Druk hier om de winnaars te onthullen'});
    revealBtn.addEventListener('click', function(){
      state.phase = 'winnersConfirm';
      render();
    });
    bar.appendChild(revealBtn);
    var back = el('button', {class:'action ghost sm', text:'← Terug (per ongeluk gedrukt)'});
    back.addEventListener('click', function(){ state.phase = 'shield'; render(); });
    bar.appendChild(back);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- WINNERS CONFIRM: laatste bevestiging voor het echte winnaarsscherm ----------
  function renderWinnersConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'Weet je het zeker?'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action safe lg', text:'Ja, onthullen'});
    yes.addEventListener('click', function(){
      state.phase = 'gameEnd';
      render();
    });
    bar.appendChild(yes);
    var no = el('button', {class:'action ghost sm', text:'← Nee, terug'});
    no.addEventListener('click', function(){
      state.phase = 'identityReveal';
      render();
    });
    bar.appendChild(no);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- GAME END: winnaars-overzicht — pas gebruiken als het spel echt is
  // afgelopen en iedereen zijn rol heeft onthuld, want vanaf hier is niets meer geheim ----------
  function renderGameEnd(){
    var screen = el('div', {class:'screen'});
    var survivors = alivePlayers();
    var traitorsAlive = aliveTraitors();
    var traitorsWin = traitorsAlive.length > 0;
    var winTitle = traitorsWin
      ? (traitorsAlive.length === 1 ? 'De overgebleven verrader heeft gewonnen!' : 'De verraders winnen')
      : 'De getrouwen winnen';

    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-label', text:'Het spel is afgelopen'}));
    wrap.appendChild(el('div', {class:'reveal-name', text: winTitle}));
    screen.appendChild(wrap);

    var grid = el('div', {class:'grid'});
    survivors.forEach(function(p){
      var isTraitor = state.traitors.indexOf(p.name) !== -1;
      var tile = el('div', {class:'tile tile-stack' + (isTraitor ? ' traitor-marked' : '')});
      tile.appendChild(el('div', {text: p.name}));
      tile.appendChild(el('div', {class:'dead-status-label', text: isTraitor ? 'verrader' : 'getrouwe'}));
      var votes = (state.voteTotals && state.voteTotals[p.name]) || 0;
      var shields = (state.shieldCounts && state.shieldCounts[p.name]) || 0;
      tile.appendChild(el('div', {class:'dead-status-label', text: votes + ' tegenstem' + (votes === 1 ? '' : 'men')}));
      tile.appendChild(el('div', {class:'dead-status-label', text: shields + ' schild' + (shields === 1 ? '' : 'en') + ' verdiend'}));
      grid.appendChild(tile);
    });
    screen.appendChild(grid);

    var bar = el('div', {class:'bar'});
    var back = el('button', {class:'action ghost sm', text:'← Terug naar begeleider'});
    back.addEventListener('click', function(){ state.phase = 'gameEndExitConfirm'; render(); });
    bar.appendChild(back);
    screen.appendChild(bar);
    return screen;
  }

  // ---------- GAME END EXIT CONFIRM: vangnet tegen per ongeluk wegklikken van het winnaarsscherm ----------
  function renderGameEndExitConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'warn', text:'Let op: als je doorgaat, verdwijnt dit scherm ook op de statuspagina in de andere kamer.'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action primary lg', text:'Ja, doorgaan'});
    yes.addEventListener('click', function(){
      state.shieldMode = 'schild';
      state.phase = 'shield';
      render();
    });
    bar.appendChild(yes);
    var no = el('button', {class:'action ghost sm', text:'← Nee, terug naar winnaars'});
    no.addEventListener('click', function(){ state.phase = 'gameEnd'; render(); });
    bar.appendChild(no);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- REVEAL ----------
  function renderReveal(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-label', text:'is vermoord'}));
    wrap.appendChild(el('div', {class:'reveal-name', text: state.lastVictim}));
    var alive = alivePlayers().length;
    wrap.appendChild(el('div', {class:'reveal-sub', text: alive + ' spelers nog in leven'}));
    wrap.appendChild(el('div', {class:'reveal-message', text:'Druk op bevestig en laat het slachtoffer het volgende scherm lezen.'}));

    var bar = el('div', {class:'bar'});
    var nextBtn = el('button', {class:'action primary', text:'Geef door aan ' + state.lastVictim});
    nextBtn.addEventListener('click', function(){ state.phase = 'victimInstructions'; render(); });
    bar.appendChild(nextBtn);
    var mistakeBtn = el('button', {class:'action ghost sm', text:'Vergissing — terug naar vorige scherm'});
    mistakeBtn.addEventListener('click', function(){
      var victim = state.lastVictim;
      state.players.forEach(function(p){
        if(p.name === victim){ p.alive = true; p.deathType = null; }
      });
      for(var i = state.victimHistory.length - 1; i >= 0; i--){
        if(state.victimHistory[i].night === state.night && state.victimHistory[i].victim === victim && state.victimHistory[i].type === 'murder'){
          state.victimHistory.splice(i, 1);
          break;
        }
      }
      state.lastVictim = null;
      state.phase = state.lastVictimReturnPhase || 'nightHandoff';
      state.lastVictimReturnPhase = null;
      render();
    });
    bar.appendChild(mistakeBtn);
    wrap.appendChild(bar);
    screen.appendChild(wrap);

    return screen;
  }

  // ---------- VICTIM INSTRUCTIONS (private — alleen voor wie net vermoord is) ----------
  function renderVictimInstructions(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-label', text:'Alleen voor ' + state.lastVictim}));
    wrap.appendChild(el('div', {class:'reveal-name', text:'Je bent vermoord'}));
    wrap.appendChild(el('div', {class:'reveal-message', text:'Verlaat zonder geluid te maken de tafel en loop naar de andere ruimte.'}));

    var bar = el('div', {class:'bar'});
    var nextBtn = el('button', {class:'action primary lg', text:'Volgende dag'});
    nextBtn.addEventListener('click', function(){ state.phase = 'nextDayConfirm'; render(); });
    bar.appendChild(nextBtn);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- NEXT DAY CONFIRM: laatste bevestiging voordat de dag echt begint ----------
  function renderNextDayConfirm(){
    var screen = el('div', {class:'screen'});
    var wrap = el('div', {class:'reveal-wrap'});
    wrap.appendChild(el('div', {class:'reveal-message', text:'De volgende dag begint. Weet je het zeker?'}));

    var bar = el('div', {class:'bar'});
    var yes = el('button', {class:'action primary lg', text:'Bevestig'});
    yes.addEventListener('click', function(){ goToShieldPhase(); });
    bar.appendChild(yes);
    var back = el('button', {class:'action ghost sm', text:'← Terug'});
    back.addEventListener('click', function(){ state.phase = 'victimInstructions'; render(); });
    bar.appendChild(back);
    wrap.appendChild(bar);
    screen.appendChild(wrap);
    return screen;
  }

  // ---------- CONNECT (pick / join a room so 2 iPads can sync) ----------
  function renderConnect(){
    var screen = el('div', {class:'screen'});
    screen.appendChild(el('h1', {text:'De Verraders'}));
    screen.appendChild(el('div', {class:'subtitle', text: supabaseClient ? 'Verbind deze iPad met een spel' : '⚠️ Kon niet met het synchronisatie-systeem verbinden — deze iPad speelt lokaal'}));

    var instr = el('div', {class:'instruction'});
    instr.textContent = 'Start een nieuw spel, of vul de kamercode van de andere iPad in';
    screen.appendChild(instr);

    var bar1 = el('div', {class:'bar'});
    var newBtn = el('button', {class:'action primary lg', text:'Nieuw spel starten'});
    newBtn.addEventListener('click', function(){
      connectToRoom(makeRoomCode(), false);
    });
    bar1.appendChild(newBtn);
    screen.appendChild(bar1);

    screen.appendChild(el('div', {class:'connect-divider', text:'of'}));

    var addRow = el('div', {class:'add-row'});
    var input = el('input', {class:'text-input', type:'text', placeholder:'Kamercode', maxlength:'8'});
    input.style.textTransform = 'uppercase';
    input.style.textAlign = 'center';
    input.style.letterSpacing = '4px';
    var joinBtn = el('button', {class:'action primary', text:'Verbinden'});
    joinBtn.addEventListener('click', function(){
      var code = input.value.trim().toUpperCase();
      if(!code){ alert('Vul de kamercode in.'); return; }
      connectToRoom(code, true);
    });
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') joinBtn.click(); });
    addRow.appendChild(input);
    addRow.appendChild(joinBtn);
    screen.appendChild(addRow);

    if(!supabaseClient){
      var skipLink = el('div', {class:'small-link', text:'Zonder synchronisatie verdergaan'});
      skipLink.addEventListener('click', function(){
        roomCode = 'lokaal';
        loadLocalCache();
        paint();
      });
      screen.appendChild(skipLink);
    }

    return screen;
  }

  function boot(){
    var app = document.getElementById('app');
    var existing = loadRoomCode();
    if(existing){
      connectToRoom(existing, true);
    } else {
      app.innerHTML = '';
      app.appendChild(renderConnect());
    }
  }

  boot();
})();
</script>
</body>
</html>
